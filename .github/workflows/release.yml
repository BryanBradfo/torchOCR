name: Release

# Pushing a version tag (v0.4.1, v1.0.0, ...) builds the sdist and wheel and publishes them to PyPI
# through trusted publishing (OIDC): no API token is stored in the repository. PyPI must list this
# repository, this workflow file and the `pypi` environment as a trusted publisher.

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME != version $version"; exit 1; }

      - name: Smoke-test the wheel outside the source tree
        run: |
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import torchocr; from torchocr import load_charset; assert len(load_charset('ppocr_keys_v1', 6625)) == 6625; print(torchocr.__version__)"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/torchocr/
    permissions:
      id-token: write  # OIDC token for PyPI trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
