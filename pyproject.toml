[build-system]
requires = ["setuptools>=77"]  # SPDX `license` expression
build-backend = "setuptools.build_meta"

[project]
name = "torchocr"
version = "0.4.1"
description = "PyTorch-native end-to-end OCR pipeline."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision>=0.23",  # tv_tensors.KeyPoints (torchocr.transforms.v2)
    "pymupdf",
    "scipy",
    "opencv-python-headless",
    "pyclipper",
    "shapely>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "lmdb",
    "pyarrow",
]
lmdb = [
    "lmdb",
]
docs = [
    "sphinx>=8",
    "sphinx-gallery>=0.17",
    "pydata-sphinx-theme>=0.16",
    "matplotlib",
]
convert = [
    "paddlepaddle>=2.5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
torchocr = ["data/*.txt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
